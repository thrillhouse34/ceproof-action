name: 'CEProof'
description: 'Derive an EU Cyber Resilience Act compliance posture from your repo and track what still needs a human.'
author: 'CEProof'

branding:
  icon: 'shield'
  color: 'purple'

inputs:
  path:
    description: 'Project path to scan, relative to the workspace.'
    required: false
    default: '.'
  fail-on:
    description: 'When to fail the job: human-required (default), partial, or never.'
    required: false
    default: 'human-required'
  config:
    description: 'Path to ceproof.config.json, where your answers to the human-required items live. Defaults to <path>/ceproof.config.json. Generate one with `npx ceproof init`.'
    required: false
    default: ''
  include-dev:
    description: 'Set to true to include devDependencies. Production dependencies only by default.'
    required: false
    default: 'false'
  project-license:
    description: 'SPDX id or expression for your own project, overriding the one in package.json.'
    required: false
    default: ''
  version:
    description: 'Version of the ceproof npm package to run. Pinned by default; override only to test a newer release.'
    required: false
    default: '0.3.3'
  out:
    description: 'Directory for report.json and summary.md. Defaults to a directory under the runner temp dir, so your checkout stays clean.'
    required: false
    default: ''
  summary:
    description: 'Set to false to skip writing the report to the job summary.'
    required: false
    default: 'true'
  upload-artifact:
    description: 'Set to false to skip uploading the report as a build artifact.'
    required: false
    default: 'true'
  artifact-name:
    description: 'Name of the uploaded artifact.'
    required: false
    default: 'ceproof-report'
  artifact-retention-days:
    description: 'Days before the uploaded artifact expires. 0 uses the repository default, which is what actions/upload-artifact documents for this value.'
    required: false
    default: '0'

outputs:
  outcome:
    description: 'pass or fail — whether the scan tripped the fail-on threshold.'
    value: ${{ steps.scan.outputs.outcome }}
  total-items:
    description: 'Number of CRA checklist items evaluated (Annex VII and Annex V).'
    value: ${{ steps.scan.outputs.total-items }}
  derived-count:
    description: 'Items fully derived from evidence in the repo.'
    value: ${{ steps.scan.outputs.derived-count }}
  partial-count:
    description: 'Items with some evidence but not enough to stand alone.'
    value: ${{ steps.scan.outputs.partial-count }}
  needs-human-input-count:
    description: 'Items that need an answer from you — no evidence can supply them.'
    value: ${{ steps.scan.outputs.needs-human-input-count }}
  config-present:
    description: 'true when a ceproof.config.json was found.'
    value: ${{ steps.scan.outputs.config-present }}
  config-valid:
    description: 'true, false, or unknown when there is no config to validate.'
    value: ${{ steps.scan.outputs.config-valid }}
  report-path:
    description: 'Absolute path to the machine-readable report.json.'
    value: ${{ steps.scan.outputs.report-path }}
  summary-path:
    description: 'Absolute path to the Markdown summary.'
    value: ${{ steps.scan.outputs.summary-path }}

runs:
  using: 'composite'
  steps:
    # The whole behaviour lives in scripts/run.sh so that scripts/simulate.sh can
    # exercise the identical code path locally. Keep logic out of this file.
    - id: scan
      shell: bash
      run: bash "$GITHUB_ACTION_PATH/scripts/run.sh"
      env:
        INPUT_PATH: ${{ inputs.path }}
        INPUT_FAIL_ON: ${{ inputs.fail-on }}
        INPUT_CONFIG: ${{ inputs.config }}
        INPUT_INCLUDE_DEV: ${{ inputs.include-dev }}
        INPUT_PROJECT_LICENSE: ${{ inputs.project-license }}
        INPUT_VERSION: ${{ inputs.version }}
        INPUT_OUT: ${{ inputs.out }}
        INPUT_SUMMARY: ${{ inputs.summary }}

    # always() so the report still lands when the scan failed the job — that is
    # exactly the run you want the artifact for.
    - if: ${{ always() && inputs.upload-artifact == 'true' && steps.scan.outputs.report-path != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: |
          ${{ steps.scan.outputs.report-path }}
          ${{ steps.scan.outputs.summary-path }}
        retention-days: ${{ inputs.artifact-retention-days }}
        if-no-files-found: error
